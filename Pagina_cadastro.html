<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="styleJoao.css">
</head>

<header class="header-cadastro">
</header>

<body class="body-cadastro">

    <img src="img/fundo_login.jpeg" class="fundo">
    
    <a href="Pagina_Login.html">
        <img class="voltar" src="img/Arrow_left.svg">
    </a>
   
    <img src="img/LogoMãospng.png" class="logo_cadastro">

    <div class="container_cadastro">

        <form class="formulario">

            
            <h1>Cadastro</h1>

            <center>
            <h2>Informações pessoais</h2><br>
            </center>

            <div class="linha">
                <div class="campo">
                    <label for="nome"><strong>Nome: </strong></label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome">
                </div>

                <div class="campo">
                    <label for="dataNascimento">
                        <strong>Data de nascimento:</strong>
                    </label>

                    <input type="date" id="dataNascimento" name="dataNascimento">
                </div>

                <div class="campo">
                    <label for="sexo">
                        <strong>Sexo:</strong>
                    </label>

                    <select id="sexo" name="sexo">
                        <option value="">Selecione</option>
                        <option value="F">Feminino</option>
                        <option value="M">Masculino</option>
                        <option value="O">Outro</option>
                    </select>
                </div>


                <div class="campo">
                    <label for="cpf"><strong>CPF: </strong></label>
                    <input type="text" id="cpf" name="cpf" placeholder="Digite seu CPF">
                </div>
            </div>

            <div class="linha">
                <div class="campo">
                    <label for="email"><strong>Email:</strong> </label>
                    <input type="email" id="email" name="email" placeholder="Digite seu email">
                </div>

                <div class="campo">
                    <label for="telefone"><strong>Telefone:</strong> </label>
                    <input type="tel" id="telefone" name="telefone" placeholder="Digite seu nome">
                </div>
            </div>


        <div class="campo">
            <label for="eSurdo"><strong>Você tem deficiência auditiva?</strong></label>

            <select id="eSurdo" name="eSurdo">
                <option value="">Selecione</option>
                <option value="true">Sim</option>
                <option value="false">Não</option>
            </select>
        </div>
            
            <center>
                <div class="button">
                    <button type="button" onclick="salvarPagina1()">
                    Continuar
                    </button>
                </div>
            </center>

            <script>
                /*Define função botão*/
                function salvarPagina1(){

                    /*Captura os dados do formulario na variavel dados*/
                    const dados = {
                        nome: document.getElementById("nome").value.trim(),
                        cpf: document.getElementById("cpf").value.replace(/\D/g, ""),
                        email: document.getElementById("email").value.trim(),
                        telefone: document.getElementById("telefone").value.trim(),
                        eSurdo: document.getElementById("eSurdo").value,
                        dataNascimento: document.getElementById("dataNascimento").value,
                        sexo: document.getElementById("sexo").value
                    };


                    if (!dados.nome || !dados.cpf || !dados.email || !dados.telefone || !dados.dataNascimento || !dados.sexo || dados.eSurdo === "") {
                        alert("Preencha todos os campos.");
                        return;
                    }

                    /*Armazena no local do navegador como dados cadastro transformando em texto*/
                    localStorage.setItem(
                        "dadosCadastro",
                        JSON.stringify(dados)
                    );

                    /*Leva a proxima página*/
                    window.location.href = "Pagina_cadastro2.html";
                }
            </script>

            </div>
        </div>
    
</form>
</body>
</html>
