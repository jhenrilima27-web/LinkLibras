<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar os Interpretes</title>
    <link rel="stylesheet" href="styleJoao.css">
</head>
<body class="body_interpretes">

    <img src="img/fundo_login.jpeg" class="fundo">

    <a href="index.html">
        <img class="voltar" src="img/Arrow_left.svg">
    </a>
    
    <img src="img/LogoMãospng.png" class="logo_interprete">

    <div class="container_cadastro_interpretes">

        <h1>Cadastro de Intérpretes</h1><br>

        <form id="formInterprete">

            <div class="linha">
                <!-- NOME -->
                <div class="campo">

                    <label for="nome">
                        <strong> Nome do Intérprete: </strong>
                    </label>

                    <input type="text" id="nome" name="nome"
                        required
                        minlength="3"
                        maxlength="200"
                        placeholder="Digite seu nome completo">

                </div>

                <div class="campo">
                    <label for="dataNascimento"><strong>Data de Nascimento:</strong></label>
                    <input type="date" id="dataNascimento" name="dataNascimento" required>
                </div>
            </div>

            <div class="linha">
                <div class="campo">
                    <label for="email"><strong>E-mail:</strong></label>
                    <input type="email" id="email" name="email" required placeholder="Digite seu e-mail">

                </div>

                <div class="campo">
                    <label for="senha"><strong>Senha:</strong></label>
                    <input type="password" id="senha" name="senha" required minlength="8" placeholder="Crie uma senha">

                </div>
            </div>

            <div class="linha">
                <div class="campo">
                    <label for="telefone"><strong>Telefone:</strong></label>
                    <input type="tel" id="telefone" name="telefone" placeholder="Digite seu telefone">
                </div>

                <div class="campo">
                    <label for="sexo"><strong>Sexo:</strong></label>
                    <select id="sexo" name="sexo" required >
                        <option value="">Selecione</option>
                        <option value="F">Feminino</option>
                        <option value="M">Masculino</option>
                        <option value="O">Outro</option>
                    </select>
                </div>
            </div>

            <div class="linha">
                <div class="campo">
                    <label for="estado"><strong>Estado:</strong></label>
                    <input type="text" id="estado" name="estado" placeholder="Digite seu estado">
                </div>

                <div class="campo">
                    <label for="cidade"><strong>Cidade:</strong></label>
                    <input type="text" id="cidade" name="cidade" placeholder="Digite sua cidade">
                </div>
            </div>

            <div class="linha">
                <div class="campo">
                    <label for="bairro"><strong>Bairro:</strong></label>
                    <input type="text" id="bairro" name="bairro" placeholder="Digite seu bairro">
                </div>

                <div class="campo">
                    <label for="valorHora"><strong>Preço por hora:</strong></label>
                    <input type="number" id="valorHora" name="valorHora"
                        min="0.01" step="0.01" required placeholder="Ex: 150,00">
                </div>
            </div>

            <div class="linha">
                <div class="campo">
                    <label for="foto"><strong>Foto do intérprete:</strong></label>
                    <input type="url" id="foto" name="foto" value="https://picsum.photos/300/200?random=1" placeholder="Cole o link da sua foto">
                </div>

                <div class="campo">
                    <label for="descrição"><strong>Descrição:</strong></label>
                    <input type="text" id="descricao" name="descricao" maxlength="100" placeholder="Conte um pouco sobre sua experiência">
                </div>
            </div>

                




            <!-- BOTÃO -->
            <center>
                <button type="submit">
                    Cadastrar Intérprete
                </button>
            </center>

        </form>

    </div>

<script>
	
document.getElementById("formInterprete").addEventListener("submit", cadastrarInterprete);


async function cadastrarInterprete(evento) {

    // EVITA RECARREGAR A PÁGINA
    evento.preventDefault();


const form = document.getElementById("formInterprete"); // CAPTURA O FORMULÁRIO
const dadosForm = new FormData(form); // CAPTURA TODOS OS CAMPOS
const interprete = Object.fromEntries( dadosForm.entries()  ); // CONVERTE PARA OBJETO
console.log(interprete); // EXIBE OBJETO'

    try {
        // ENVIA PARA API PHP
        const resposta = await fetch("http://localhost:8081/api/auth/interpretes/cadastro", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(interprete)
        });

		debugger;
	
        // CONVERTE RESPOSTA
        const dados = await resposta.json();

        if (resposta.ok) {
            alert("Intérprete cadastrado com sucesso!");
            form.reset();
        } else {
            alert(
                dados.mensagem || dados.message || "Não foi possível realizar o cadastro."
            );
        }

        
    } catch(erro) {

        console.error(erro);

        alert("Não foi possível conectar ao servidor");
    }
}

</script>
</body>
</html>
