<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styleJoao.css">
</head>
<body class="body-login">

    <img src="img/fundo_login.jpeg" class="fundo">

    <a href="index.html">
        <img class="voltar" src="img/Arrow_left.svg">
    </a>

    <img src="img/LogoMãospng.png" class="logo_login">

    <div class="login-container">
        <h1>Login</h1><br>

        <form id="formLogin">
            <label for="email"><strong>Email:</strong></label><br>
            <input type="email" id="email" name="email" placeholder="Digite seu email" required><br><br>

            <label for="senha"><strong>Senha:</strong></label><br>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required><br><br>

            <h4>Tipo de perfil:</h4>

            <div class="grupo-radio">
                <input type="radio" id="usuario" name="perfil" value="usuario" required>
                <label for="usuario" class="opcao-radio">Usuário</label>

                <input type="radio" id="interprete" name="perfil" value="interprete">
                <label for="interprete" class="opcao-radio">Intérprete</label>
            </div>

        <div class="botoes">
            <a href="Pagina_cadastro.html">
                <button type="button">Cadastrar-se</button>
            </a>
            
            <a>
                <button type="submit">Entrar</button>
            </a>
        </div>
        </form>
    </div>

    <script>

        const formulario = document.getElementById("formLogin");

        formulario.addEventListener("submit", async function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value;
            const senha = document.getElementById("senha").value;

            const perfil = document.querySelector(
                'input[name="perfil"]:checked' 
            );

            if (!perfil) {
                alert("Selecione o tipo de perfil.");
                return;
            }

            const endpoint = perfil.value === "usuario"
                ? "/api/auth/usuarios/login"
                : "/api/auth/interpretes/login";

            try {

                const resposta = await fetch(
                    "http://localhost:8081" + endpoint,
                    {
                        method: "Post",
                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            senha: senha 
                        })
                    }
                );

                const resultado = await resposta.json();

                if (resposta.ok) /* redireciona*/ {

                    localStorage.setItem(
                        "token",
                        resultado.token 
                    );

                    localStorage.setItem(
                        "usuarioLogado",
                        JSON.stringify(resultado) 
                    );


                    window.location.href = "index.html";

                } else /*exibe erro*/ {

                    alert(
                        resultado.mensagem || resultado.message || "E-mail ou senha incorretos.");

                }

            } catch (erro) {

                console.error(erro);

                alert("Não foi possível conectar ao servidor.");
            }

        });

    </script>
</body>
</html>
