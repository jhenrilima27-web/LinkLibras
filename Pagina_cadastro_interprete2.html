<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar os Interpretes</title>
    <link rel="stylesheet" href="styleJoao.css">
</head>
<body class="body_interpretes">

    <img src="img/fundo_login.jpeg" class="fundo">

    <a href="index.html">
        <img class="voltar" src="img/Arrow_left.svg">
    </a>

    <img src="img/LogoMãospng.png" class="logo_interprete">

    <div class="container_cadastro_interpretes">

        <form id="formInterprete2">

            <h1>Cadastro</h1>

            <center>
            <h2>Endereço</h2><br>
            </center>

            <div class="linha">

                <div class="campo">
                    <label for="cep"><strong>CEP: </strong></label>
                    <input type="text" id="cep" name="cep" maxlength="9" placeholder="Digite seu CEP">
                </div>

                <div class="campo">
                    <label for="estado">
                        <strong>Estado:</strong>
                    </label>
                    <input type="text" id="estado" name="estado" placeholder="Digite seu estado">
                </div>
            </div>

            <div class="linha">
                <div class="campo">
                    <label for="bairro">
                        <strong>Bairro:</strong>
                    </label>
                    <input type="text" id="bairro" name="bairro" placeholder="Digite seu bairro">
                </div>

                <div class="campo">
                    <label for="cidade">
                        <strong>Cidade:</strong>
                    </label>
                    <input type="text" id="cidade" name="cidade" placeholder="Digite sua cidade">
                </div>
             </div>


            <div>
                <label for="complemento"><strong>Complemento:</strong></label>
                <input type="text" id="complemento" name="complemento" placeholder="Digite o Complemento">
            </div><br><br>

            <center>
                <button type="button" onclick="voltarPagina()">
                    Voltar
                </button>

                <button type="submit">
                    Continuar
                </button>
            </center>
        </form>
    </div>

<script>

    // Recupera os dados pessoais preenchidos na página 1
    const dadosSalvos = sessionStorage.getItem("dadosCadastroInterprete");

    // Verifica se existem dados da primeira página
    if (!dadosSalvos) {
        alert("Preencha primeiro seus dados pessoais.");
        window.location.href = "Pagina_cadastro_interprete1.html";
    } else {

        const formulario = document.getElementById("formInterprete2");
    


        // Recupera os dados anteriores
        const dadosAnteriores = JSON.parse(dadosSalvos);


        // Preenche os campos caso o usuário volte à página 2
     Object.entries(dadosAnteriores).forEach(function([chave, valor]) {

         const campo = formulario.elements.namedItem(chave);

            if (campo && campo.type !== "file") {
                campo.value = valor;
            }

        });

        // Evento do botão Continuar
        formulario.addEventListener("submit", function(evento) {

            evento.preventDefault();


        // Captura os dados de endereço
    
        const dadosEndereco = Object.fromEntries(
         new FormData(formulario).entries() 
        );

        // Junta os dados pessoais com os dados de endereço
        const dadosCompletos = {
            ...dadosAnteriores,
          ...dadosEndereco
        };

     // Salva tudo novamente no sessionStorage
        sessionStorage.setItem(
            "dadosCadastroInterprete",
            JSON.stringify(dadosCompletos)
        );


        // Avança para a segunda página
        window.location.href = "Pagina_cadastro_interprete3.html";
    });

}

// Função para voltar à página anterior
function voltarPagina() {
    window.location.href = "Pagina_cadastro_interprete1.html";
}

</script>
</body>
</html>
