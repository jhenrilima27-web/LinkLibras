<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar os Interpretes</title>
    <link rel="stylesheet" href="styleJoao.css">
</head>
<body class="body_interpretes">

    <img src="img/fundo_login.jpeg" class="fundo">

    <a href="index.html">
        <img class="voltar" src="img/Arrow_left.svg">
    </a>
    
    <img src="img/LogoMãospng.png" class="logo_interprete">

    <div class="container_cadastro_interpretes">

        

        <form id="formInterprete1">

            <h1>Cadastro de Intérpretes</h1><br>

            <center>
            <h2>Informações pessoais</h2><br>
            </center>

            <div class="linha">
                <!-- NOME -->
                <div class="campo">

                    <label for="nome">
                        <strong> Nome do Intérprete: </strong>
                    </label>

                    <input type="text" id="nome" name="nome"
                        required
                        minlength="3"
                        maxlength="200"
                        placeholder="Digite seu nome completo">

                </div>

                <div class="campo">
                    <label for="dataNascimento"><strong>Data de Nascimento:</strong></label>
                    <input type="date" id="dataNascimento" name="dataNascimento" required>
                </div>

                <div class="campo">
                    <label for="sexo"><strong>Sexo:</strong></label>
                    <select id="sexo" name="sexo" required >
                        <option value="">Selecione</option>
                        <option value="F">Feminino</option>
                        <option value="M">Masculino</option>
                        <option value="O">Outro</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="cpf"><strong>CPF: </strong></label>
                    <input type="text" id="cpf" name="cpf" placeholder="Digite seu CPF">
                </div>
            </div>

            <div class="linha">
                <div class="campo">
                    <label for="email"><strong>E-mail:</strong></label>
                    <input type="email" id="email" name="email" required placeholder="Digite seu e-mail">

                </div>

                <div class="campo">
                    <label for="telefone"><strong>Telefone:</strong></label>
                    <input type="tel" id="telefone" name="telefone" placeholder="Digite seu telefone">
                </div>
            </div>

            
            


            <!-- BOTÃO -->
            <center>
                <button type="submit">
                    Continuar
                </button>
            </center>

        </form>

    </div>

<script>


const formulario = document.getElementById("formInterprete1");

// Recupera os dados que já foram salvos anteriormente
const dadosSalvos = sessionStorage.getItem("dadosCadastroInterprete");

const dadosAnteriores = dadosSalvos
    ? JSON.parse(dadosSalvos)
    : {};

// Preenche automaticamente os campos da página 1
Object.entries(dadosAnteriores).forEach(function([chave, valor]) {

    const campo = formulario.elements.namedItem(chave);

    if (campo && campo.type !== "file") {
        campo.value = valor;
    }

});

// Salva os dados ao clicar em Continuar
formulario.addEventListener("submit", function(evento) {

    evento.preventDefault();

    // Captura os dados preenchidos na página 1
    const dadosPagina1 = Object.fromEntries(
        new FormData(formulario).entries()
    );

    // Junta os dados novos com os dados que já estavam salvos
    const dadosCompletos = {
        ...dadosAnteriores,
        ...dadosPagina1
    };

    // Atualiza o armazenamento temporário
    sessionStorage.setItem(
        "dadosCadastroInterprete",
        JSON.stringify(dadosCompletos)
    );

    // Avança para a página 2
    window.location.href = "Pagina_cadastro_interprete2.html";

});


</script>
</body>
</html>
