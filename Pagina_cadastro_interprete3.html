<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar os Interpretes</title>
    <link rel="stylesheet" href="styleJoao.css">
</head>
<body class="body_interpretes">

<img src="img/fundo_login.jpeg" class="fundo">

    <a href="index.html">
        <img class="voltar" src="img/Arrow_left.svg">
    </a>

    <img src="img/LogoMãospng.png" class="logo_interprete">

    <div class="container_cadastro_interpretes">

        <form id="formInterprete3">

            <h1>Cadastro</h1>

            <center>
            <h2>Informações Profissionais</h2><br>
            </center>


            <div class="linha">
                <div class="campo">
                    <label for="valorHora"><strong>Preço por hora:</strong></label>
                    <input type="number" id="valorHora" name="valorHora" min="0.01" step="0.01" required placeholder="Ex: 150,00">
                </div>

                <div class="campo">
                    <label for="foto"><strong>Foto do intérprete:</strong></label>
                    <input type="file" id="foto" name="foto" accept="image/png, image/jpeg, image/webp">
                    <small id="nomeFoto"></small>
                </div>
            </div>

            <div class="linha">
                <div class="campo">
                    <label for="descricao"><strong>Descrição:</strong></label>
                    <input type="text" id="descricao" name="descricao" maxlength="100" placeholder="Conte um pouco sobre sua experiência">
                </div>

                <div class="campo">
                    <label for="especialidades"><strong>Especialidades</strong></label>
                    <input type="text" id="especialidades" name="especialidades" placeholder="Informe suas especialidades">
                </div>
            </div>

            <div class="linha">
                <div class="campo">
                    <label for="senha"><strong>Senha:</strong></label>
                    <input type="password" id="senha" name="senha" placeholder="Digite aqui uma senha">
                </div>
            </div>

            

            <center>
                <button type="button" onclick="voltarPagina()">
                    Voltar
                </button>

                <button type="submit">
                    Finalizar cadastro
                </button>
            </center>


        </form>
    </div>

    <script src="cadastroInterprete3.js"></script>
